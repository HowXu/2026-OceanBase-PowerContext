name: stepfun checks
on:
  push:
    paths: ['stepfun/**', '.github/workflows/stepfun.yml']
  pull_request:
    paths: ['stepfun/**', '.github/workflows/stepfun.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stepfun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stepfun/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
