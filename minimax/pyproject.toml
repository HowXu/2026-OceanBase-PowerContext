[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sdd-context"
version = "0.1.0"
description = "Versioned engineering context, seekdb retrieval and PowerContext task checkpoints"
requires-python = ">=3.11,<3.14"
dependencies = [
  "powercontext[builtin]==1.4.0",
  "pycasbin==2.8.0",
  "pylibseekdb==1.4.0.post1",
  "httpx==0.28.1",
  "pytest==8.4.2",
]

[project.scripts]
sdd-context = "sdd_context.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sdd_context"]

[tool.pytest.ini_options]
testpaths = ["tests"]

