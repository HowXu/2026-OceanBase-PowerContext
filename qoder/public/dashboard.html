<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 - 任务进度追踪器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>📋 任务追踪器</h1>
        <p>PowerContext 驱动</p>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="/" class="nav-link active">
            <span class="icon"></span>
            <span>仪表盘</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/tasks" class="nav-link">
            <span class="icon">📝</span>
            <span>任务管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="/handoff" class="nav-link">
            <span class="icon">🔄</span>
            <span>工作交接</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h2>仪表盘</h2>
        <p>任务进度概览与统计</p>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card primary">
          <div class="stat-icon">📋</div>
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">总任务</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-icon">⏳</div>
          <div class="stat-value" id="statTodo">0</div>
          <div class="stat-label">待办</div>
        </div>
        <div class="stat-card info">
          <div class="stat-icon">🔄</div>
          <div class="stat-value" id="statProgress">0</div>
          <div class="stat-label">进行中</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon">✅</div>
          <div class="stat-value" id="statDone">0</div>
          <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon"></div>
          <div class="stat-value" id="statHighPriority">0</div>
          <div class="stat-label">高优先级</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📈</div>
          <div class="stat-value" id="statAvgProgress">0%</div>
          <div class="stat-label">平均进度</div>
        </div>
      </div>

      <!-- Recent Tasks -->
      <div class="card">
        <div class="card-header">
          <h3>最近任务</h3>
          <a href="/tasks" class="btn btn-secondary btn-sm">查看全部</a>
        </div>
        <div class="card-body">
          <div id="recentTasks" class="task-list">
            <div class="empty-state">
              <div class="icon">📭</div>
              <p>暂无任务</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Quick Add -->
      <div class="card">
        <div class="card-header">
          <h3>快速添加任务</h3>
        </div>
        <div class="card-body">
          <form id="quickAddForm">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">任务标题</label>
                <input type="text" class="form-input" id="quickTitle" required placeholder="输入任务标题">
              </div>
              <div class="form-group">
                <label class="form-label">优先级</label>
                <select class="form-select" id="quickPriority">
                  <option value="low">低</option>
                  <option value="medium" selected>中</option>
                  <option value="high">高</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">描述（可选）</label>
              <input type="text" class="form-input" id="quickDesc" placeholder="任务描述">
            </div>
            <button type="submit" class="btn btn-primary">添加任务</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    // Dashboard specific logic
    document.addEventListener('DOMContentLoaded', () => {
      loadDashboard();
    });

    async function loadDashboard() {
      await Promise.all([loadStats(), loadRecentTasks()]);
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/summary');
        const data = await res.json();
        document.getElementById('statTotal').textContent = data.total;
        document.getElementById('statTodo').textContent = data.todo;
        document.getElementById('statProgress').textContent = data.inProgress;
        document.getElementById('statDone').textContent = data.done;
        document.getElementById('statHighPriority').textContent = data.highPriority;
        document.getElementById('statAvgProgress').textContent = data.averageProgress + '%';
      } catch (e) {
        console.error('Failed to load stats:', e);
      }
    }

    async function loadRecentTasks() {
      try {
        const res = await fetch('/api/tasks');
        const data = await res.json();
        const tasks = data.tasks.slice(-5).reverse();
        const container = document.getElementById('recentTasks');

        if (tasks.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon"></div><p>暂无任务</p></div>';
          return;
        }

        container.innerHTML = tasks.map(task => `
          <div class="task-item">
            <div class="task-item-header">
              <div class="task-item-title">${escapeHtml(task.title)}</div>
              <span class="badge badge-${getStatusClass(task.status)}">${getStatusLabel(task.status)}</span>
            </div>
            <div class="task-item-meta">
              <span class="badge badge-${getPriorityClass(task.priority)}">${getPriorityLabel(task.priority)}</span>
              ${task.deadline ? `<span class="badge badge-gray">📅 ${task.deadline}</span>` : ''}
            </div>
            <div class="progress-container">
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${task.progress}%"></div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load recent tasks:', e);
      }
    }

    // Quick add form
    document.getElementById('quickAddForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('quickTitle').value.trim();
      const priority = document.getElementById('quickPriority').value;
      const description = document.getElementById('quickDesc').value.trim();

      if (!title) return;

      try {
        await fetch('/api/tasks', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, priority, description }),
        });
        document.getElementById('quickAddForm').reset();
        await loadDashboard();
      } catch (e) {
        alert('添加失败');
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getStatusClass(status) {
      return { todo: 'warning', in_progress: 'info', done: 'success' }[status] || 'gray';
    }

    function getStatusLabel(status) {
      return { todo: '待办', in_progress: '进行中', done: '已完成' }[status] || status;
    }

    function getPriorityClass(priority) {
      return { low: 'success', medium: 'warning', high: 'danger' }[priority] || 'gray';
    }

    function getPriorityLabel(priority) {
      return { low: '低优先级', medium: '中优先级', high: '高优先级' }[priority] || priority;
    }
  </script>
</body>
</html>
