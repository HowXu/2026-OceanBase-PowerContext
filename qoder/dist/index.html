<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务进度追踪器 - Task Progress Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px 0 rgba(0,0,0,0.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --radius: 12px;
      --radius-sm: 8px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      line-height: 1.6;
      min-height: 100vh;
    }
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background: white;
      border-right: 1px solid var(--gray-200);
      padding: 24px 0;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--gray-200);
      margin-bottom: 16px;
    }
    .sidebar-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gray-900);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-header p {
      font-size: 0.75rem;
      color: var(--gray-500);
      margin-top: 4px;
    }
    .nav-menu { list-style: none; padding: 0 12px; }
    .nav-item { margin-bottom: 4px; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      color: var(--gray-600);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      cursor: pointer;
    }
    .nav-link:hover { background: var(--gray-100); color: var(--gray-900); }
    .nav-link.active { background: var(--primary); color: white; }
    .nav-link .icon { font-size: 1.2rem; }
    .main-content {
      flex: 1;
      margin-left: 260px;
      padding: 32px;
      max-width: 1200px;
    }
    .page-header { margin-bottom: 32px; }
    .page-header h2 { font-size: 1.75rem; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
    .page-header p { color: var(--gray-500); font-size: 0.95rem; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--gray-200);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat-card .stat-icon { font-size: 1.5rem; margin-bottom: 12px; }
    .stat-card .stat-value { font-size: 2rem; font-weight: 700; color: var(--gray-900); line-height: 1; }
    .stat-card .stat-label { font-size: 0.85rem; color: var(--gray-500); margin-top: 8px; }
    .stat-card.primary .stat-value { color: var(--primary); }
    .stat-card.success .stat-value { color: var(--success); }
    .stat-card.warning .stat-value { color: var(--warning); }
    .stat-card.danger .stat-value { color: var(--danger); }
    .stat-card.info .stat-value { color: var(--info); }
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--gray-200);
      margin-bottom: 24px;
    }
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-header h3 { font-size: 1.1rem; font-weight: 600; color: var(--gray-900); }
    .card-body { padding: 24px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
    .btn-secondary:hover { background: var(--gray-200); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--gray-700); margin-bottom: 8px; }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--gray-300);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--gray-800);
      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .form-textarea { min-height: 100px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task-item {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 20px;
      transition: all 0.2s;
    }
    .task-item:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .task-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .task-item-title { font-size: 1.05rem; font-weight: 600; color: var(--gray-900); }
    .task-item-actions { display: flex; gap: 8px; }
    .task-item-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .badge-primary { background: #eef2ff; color: var(--primary); }
    .badge-success { background: #d1fae5; color: var(--success); }
    .badge-warning { background: #fef3c7; color: var(--warning); }
    .badge-danger { background: #fee2e2; color: var(--danger); }
    .badge-info { background: #dbeafe; color: var(--info); }
    .badge-gray { background: var(--gray-100); color: var(--gray-600); }
    .progress-container { margin-bottom: 12px; }
    .progress-bar-bg { height: 8px; background: var(--gray-200); border-radius: 4px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-slider { width: 100%; margin-top: 8px; }
    .progress-slider input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      background: var(--gray-200);
      border-radius: 3px;
      outline: none;
    }
    .progress-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--primary);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--gray-500); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.5; }
    .empty-state p { font-size: 0.95rem; }
    .handoff-item {
      border-left: 4px solid var(--primary);
      padding: 16px 20px;
      background: var(--gray-50);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-bottom: 12px;
    }
    .handoff-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .handoff-item-title { font-weight: 600; color: var(--gray-900); }
    .handoff-item-time { font-size: 0.8rem; color: var(--gray-500); }
    .handoff-item-content { font-size: 0.9rem; color: var(--gray-600); margin-bottom: 8px; }
    .handoff-item-next { font-size: 0.85rem; color: var(--primary); font-weight: 500; }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal {
      background: white;
      border-radius: var(--radius);
      padding: 32px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      transform: scale(0.9);
      transition: transform 0.2s;
    }
    .modal-overlay.active .modal { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .modal-header h3 { font-size: 1.25rem; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--gray-400); padding: 4px; }
    .modal-close:hover { color: var(--gray-600); }
    .modal-footer { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--gray-200); }
    .page { display: none; }
    .page.active { display: block; }
    .info-box {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 24px;
      font-size: 0.9rem;
      color: var(--gray-700);
    }
    .info-box strong { color: var(--primary); }
    @media (max-width: 768px) {
      .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--gray-200); }
      .main-content { margin-left: 0; padding: 20px; }
      .form-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>📋 任务追踪器</h1>
        <p>PowerContext 驱动</p>
      </div>
      <ul class="nav-menu">
        <li class="nav-item">
          <a class="nav-link active" data-page="dashboard">
            <span class="icon"></span>
            <span>仪表盘</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="tasks">
            <span class="icon">📝</span>
            <span>任务管理</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="handoff">
            <span class="icon">🔄</span>
            <span>工作交接</span>
          </a>
        </li>
      </ul>
    </aside>

    <main class="main-content">
      <!-- Dashboard Page -->
      <div id="page-dashboard" class="page active">
        <div class="page-header">
          <h2>仪表盘</h2>
          <p>任务进度概览与统计</p>
        </div>
        <div class="info-box">
          <strong>💡 提示：</strong>此演示版本使用浏览器本地存储。完整版本集成 PowerContext 实现跨会话持久化。
        </div>
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card primary">
            <div class="stat-icon">📋</div>
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">总任务</div>
          </div>
          <div class="stat-card warning">
            <div class="stat-icon">⏳</div>
            <div class="stat-value" id="statTodo">0</div>
            <div class="stat-label">待办</div>
          </div>
          <div class="stat-card info">
            <div class="stat-icon">🔄</div>
            <div class="stat-value" id="statProgress">0</div>
            <div class="stat-label">进行中</div>
          </div>
          <div class="stat-card success">
            <div class="stat-icon">✅</div>
            <div class="stat-value" id="statDone">0</div>
            <div class="stat-label">已完成</div>
          </div>
          <div class="stat-card danger">
            <div class="stat-icon">🔥</div>
            <div class="stat-value" id="statHighPriority">0</div>
            <div class="stat-label">高优先级</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📈</div>
            <div class="stat-value" id="statAvgProgress">0%</div>
            <div class="stat-label">平均进度</div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">
            <h3>最近任务</h3>
            <a class="btn btn-secondary btn-sm" data-page="tasks">查看全部</a>
          </div>
          <div class="card-body">
            <div id="recentTasks" class="task-list">
              <div class="empty-state">
                <div class="icon">📭</div>
                <p>暂无任务</p>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h3>快速添加任务</h3></div>
          <div class="card-body">
            <form id="quickAddForm">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">任务标题</label>
                  <input type="text" class="form-input" id="quickTitle" required placeholder="输入任务标题">
                </div>
                <div class="form-group">
                  <label class="form-label">优先级</label>
                  <select class="form-select" id="quickPriority">
                    <option value="low">低</option>
                    <option value="medium" selected>中</option>
                    <option value="high">高</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">描述（可选）</label>
                <input type="text" class="form-input" id="quickDesc" placeholder="任务描述">
              </div>
              <button type="submit" class="btn btn-primary">添加任务</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Tasks Page -->
      <div id="page-tasks" class="page">
        <div class="page-header">
          <h2>任务管理</h2>
          <p>创建、编辑和跟踪任务进度</p>
        </div>
        <div style="margin-bottom: 24px;">
          <button class="btn btn-primary" id="btnAddTask">+ 新建任务</button>
        </div>
        <div class="card" style="margin-bottom: 24px;">
          <div class="card-body" style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
            <select class="form-select" id="filterStatus" style="width: auto; min-width: 150px;">
              <option value="">全部状态</option>
              <option value="todo">待办</option>
              <option value="in_progress">进行中</option>
              <option value="done">已完成</option>
            </select>
            <select class="form-select" id="filterPriority" style="width: auto; min-width: 150px;">
              <option value="">全部优先级</option>
              <option value="high">高优先级</option>
              <option value="medium">中优先级</option>
              <option value="low">低优先级</option>
            </select>
          </div>
        </div>
        <div id="taskList" class="task-list">
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>暂无任务</p>
          </div>
        </div>
      </div>

      <!-- Handoff Page -->
      <div id="page-handoff" class="page">
        <div class="page-header">
          <h2>工作交接</h2>
          <p>记录工作进展，便于跨会话继续工作</p>
        </div>
        <div class="card">
          <div class="card-header"><h3>创建交接记录</h3></div>
          <div class="card-body">
            <form id="handoffForm">
              <div class="form-group">
                <label class="form-label">选择任务 *</label>
                <select class="form-select" id="handoffTask" required>
                  <option value="">请选择任务</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">工作摘要</label>
                <textarea class="form-textarea" id="handoffSummary" placeholder="描述当前工作进展..."></textarea>
              </div>
              <div class="form-group">
                <label class="form-label">下一步行动 *</label>
                <input type="text" class="form-input" id="handoffNext" required placeholder="接下来需要做什么？">
              </div>
              <button type="submit" class="btn btn-primary">创建交接记录</button>
            </form>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h3>交接历史</h3></div>
          <div class="card-body">
            <div id="handoffList">
              <div class="empty-state">
                <div class="icon">🔄</div>
                <p>暂无交接记录</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">新建任务</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-group">
          <label class="form-label">任务标题 *</label>
          <input type="text" class="form-input" id="taskTitle" required>
        </div>
        <div class="form-group">
          <label class="form-label">描述</label>
          <textarea class="form-textarea" id="taskDesc"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">优先级</label>
            <select class="form-select" id="taskPriority">
              <option value="low">低</option>
              <option value="medium" selected>中</option>
              <option value="high">高</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">截止日期</label>
            <input type="date" class="form-input" id="taskDeadline">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="modalCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // LocalStorage-based data store
    const store = {
      tasks: JSON.parse(localStorage.getItem('tasks') || '[]'),
      handoffs: JSON.parse(localStorage.getItem('handoffs') || '[]'),
      taskIdCounter: parseInt(localStorage.getItem('taskIdCounter') || '1'),
      save() {
        localStorage.setItem('tasks', JSON.stringify(this.tasks));
        localStorage.setItem('handoffs', JSON.stringify(this.handoffs));
        localStorage.setItem('taskIdCounter', this.taskIdCounter.toString());
      }
    };

    // Navigation
    document.querySelectorAll('[data-page]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const page = el.dataset.page || el.getAttribute('data-page');
        showPage(page);
      });
    });

    function showPage(pageName) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      document.getElementById(`page-${pageName}`).classList.add('active');
      document.querySelector(`[data-page="${pageName}"]`)?.classList.add('active');
      if (pageName === 'dashboard') loadDashboard();
      if (pageName === 'tasks') loadTasks();
      if (pageName === 'handoff') { loadTasksForSelect(); loadHandoffs(); }
    }

    // Dashboard
    function loadDashboard() {
      const total = store.tasks.length;
      const todo = store.tasks.filter(t => t.status === 'todo').length;
      const inProgress = store.tasks.filter(t => t.status === 'in_progress').length;
      const done = store.tasks.filter(t => t.status === 'done').length;
      const highPriority = store.tasks.filter(t => t.priority === 'high').length;
      const avgProgress = total > 0 ? Math.round(store.tasks.reduce((s, t) => s + t.progress, 0) / total) : 0;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statTodo').textContent = todo;
      document.getElementById('statProgress').textContent = inProgress;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statHighPriority').textContent = highPriority;
      document.getElementById('statAvgProgress').textContent = avgProgress + '%';

      const recent = store.tasks.slice(-5).reverse();
      const container = document.getElementById('recentTasks');
      if (recent.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无任务</p></div>';
      } else {
        container.innerHTML = recent.map(task => `
          <div class="task-item">
            <div class="task-item-header">
              <div class="task-item-title">${escapeHtml(task.title)}</div>
              <span class="badge badge-${getStatusClass(task.status)}">${getStatusLabel(task.status)}</span>
            </div>
            <div class="task-item-meta">
              <span class="badge badge-${getPriorityClass(task.priority)}">${getPriorityLabel(task.priority)}</span>
              ${task.deadline ? `<span class="badge badge-gray">📅 ${task.deadline}</span>` : ''}
            </div>
            <div class="progress-container">
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${task.progress}%"></div>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    document.getElementById('quickAddForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('quickTitle').value.trim();
      const priority = document.getElementById('quickPriority').value;
      const description = document.getElementById('quickDesc').value.trim();
      if (!title) return;

      store.tasks.push({
        id: store.taskIdCounter++,
        title, description, priority,
        deadline: null, progress: 0, status: 'todo',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      });
      store.save();
      document.getElementById('quickAddForm').reset();
      loadDashboard();
    });

    // Tasks
    function loadTasks() {
      const statusFilter = document.getElementById('filterStatus').value;
      const priorityFilter = document.getElementById('filterPriority').value;
      let filtered = store.tasks;
      if (statusFilter) filtered = filtered.filter(t => t.status === statusFilter);
      if (priorityFilter) filtered = filtered.filter(t => t.priority === priorityFilter);

      const container = document.getElementById('taskList');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无任务</p></div>';
        return;
      }
      container.innerHTML = filtered.map(task => `
        <div class="task-item">
          <div class="task-item-header">
            <div class="task-item-title">${escapeHtml(task.title)}</div>
            <div class="task-item-actions">
              <button class="btn btn-secondary btn-sm" onclick="openEditModal(${task.id})">编辑</button>
              <button class="btn btn-danger btn-sm" onclick="deleteTask(${task.id})">删除</button>
            </div>
          </div>
          ${task.description ? `<p style="color: var(--gray-600); margin-bottom: 12px; font-size: 0.9rem;">${escapeHtml(task.description)}</p>` : ''}
          <div class="task-item-meta">
            <span class="badge badge-${getPriorityClass(task.priority)}">${getPriorityLabel(task.priority)}</span>
            <span class="badge badge-${getStatusClass(task.status)}">${getStatusLabel(task.status)}</span>
            ${task.deadline ? `<span class="badge badge-gray">📅 ${task.deadline}</span>` : ''}
          </div>
          <div class="progress-container">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" style="width: ${task.progress}%"></div>
            </div>
          </div>
          <div class="progress-slider">
            <input type="range" min="0" max="100" value="${task.progress}" onchange="updateProgress(${task.id}, this.value)">
            <div style="text-align: right; font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 4px;">${task.progress}%</div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('filterStatus').addEventListener('change', loadTasks);
    document.getElementById('filterPriority').addEventListener('change', loadTasks);

    document.getElementById('btnAddTask').addEventListener('click', () => {
      document.getElementById('modalTitle').textContent = '新建任务';
      document.getElementById('taskForm').reset();
      document.getElementById('taskId').value = '';
      document.getElementById('taskModal').classList.add('active');
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalCancel').addEventListener('click', closeModal);

    function closeModal() {
      document.getElementById('taskModal').classList.remove('active');
    }

    function openEditModal(id) {
      const task = store.tasks.find(t => t.id === id);
      if (!task) return;
      document.getElementById('modalTitle').textContent = '编辑任务';
      document.getElementById('taskId').value = task.id;
      document.getElementById('taskTitle').value = task.title;
      document.getElementById('taskDesc').value = task.description;
      document.getElementById('taskPriority').value = task.priority;
      document.getElementById('taskDeadline').value = task.deadline || '';
      document.getElementById('taskModal').classList.add('active');
    }

    document.getElementById('taskForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('taskId').value;
      const data = {
        title: document.getElementById('taskTitle').value.trim(),
        description: document.getElementById('taskDesc').value.trim(),
        priority: document.getElementById('taskPriority').value,
        deadline: document.getElementById('taskDeadline').value || null,
      };
      if (id) {
        const task = store.tasks.find(t => t.id === parseInt(id));
        if (task) Object.assign(task, data, { updatedAt: new Date().toISOString() });
      } else {
        store.tasks.push({
          id: store.taskIdCounter++,
          ...data,
          progress: 0, status: 'todo',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        });
      }
      store.save();
      closeModal();
      loadTasks();
    });

    function updateProgress(id, progress) {
      const task = store.tasks.find(t => t.id === id);
      if (!task) return;
      task.progress = parseInt(progress);
      if (task.progress === 100) task.status = 'done';
      else if (task.progress > 0 && task.status === 'todo') task.status = 'in_progress';
      task.updatedAt = new Date().toISOString();
      store.save();
      loadTasks();
    }

    function deleteTask(id) {
      if (!confirm('确定要删除这个任务吗？')) return;
      store.tasks = store.tasks.filter(t => t.id !== id);
      store.save();
      loadTasks();
    }

    // Handoff
    function loadTasksForSelect() {
      const select = document.getElementById('handoffTask');
      select.innerHTML = '<option value="">请选择任务</option>';
      store.tasks.forEach(task => {
        const option = document.createElement('option');
        option.value = task.id;
        option.textContent = `${task.title} (${getStatusLabel(task.status)} - ${task.progress}%)`;
        select.appendChild(option);
      });
    }

    function loadHandoffs() {
      const container = document.getElementById('handoffList');
      if (store.handoffs.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🔄</div><p>暂无交接记录</p></div>';
        return;
      }
      container.innerHTML = store.handoffs.slice().reverse().map(h => `
        <div class="handoff-item">
          <div class="handoff-item-header">
            <div class="handoff-item-title">${escapeHtml(h.taskTitle)}</div>
            <div class="handoff-item-time">${formatDate(h.createdAt)}</div>
          </div>
          ${h.summary ? `<div class="handoff-item-content">${escapeHtml(h.summary)}</div>` : ''}
          <div class="handoff-item-next">→ ${escapeHtml(h.nextAction)}</div>
          <div style="margin-top: 8px;">
            <span class="badge badge-${getPriorityClass('medium')}">进度：${h.progress}%</span>
            <span class="badge badge-${getStatusClass(h.status)}">${getStatusLabel(h.status)}</span>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('handoffForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const taskId = parseInt(document.getElementById('handoffTask').value);
      const task = store.tasks.find(t => t.id === taskId);
      if (!task) return;

      store.handoffs.push({
        id: store.handoffs.length + 1,
        taskId,
        taskTitle: task.title,
        summary: document.getElementById('handoffSummary').value.trim(),
        nextAction: document.getElementById('handoffNext').value.trim(),
        progress: task.progress,
        status: task.status,
        createdAt: new Date().toISOString(),
      });
      store.save();
      document.getElementById('handoffForm').reset();
      loadHandoffs();
      alert('交接记录已创建！');
    });

    // Helpers
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    function getStatusClass(s) { return { todo: 'warning', in_progress: 'info', done: 'success' }[s] || 'gray'; }
    function getStatusLabel(s) { return { todo: '待办', in_progress: '进行中', done: '已完成' }[s] || s; }
    function getPriorityClass(p) { return { low: 'success', medium: 'warning', high: 'danger' }[p] || 'gray'; }
    function getPriorityLabel(p) { return { low: '低优先级', medium: '中优先级', high: '高优先级' }[p] || p; }
    function formatDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // Init
    loadDashboard();
  </script>
</body>
</html>
