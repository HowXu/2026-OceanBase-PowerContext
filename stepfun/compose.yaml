services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    ports:
      - "127.0.0.1:2881:2881"
    environment:
      MEMORY_LIMIT: 2G
      CPU_COUNT: 2
      SEEKDB_DATABASE: stepfun
    volumes:
      - seekdb-data:/var/lib/seekdb
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P2881 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped
volumes:
  seekdb-data:
