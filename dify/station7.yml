      width: 250
      height: 110
      positionAbsolute:
        x: 930
        y: 280
      sourcePosition: right
      targetPosition: left
    - id: narrate
      type: custom
      position:
        x: 1240
        y: 280
      data:
        type: http-request
        title: AI 站长生成旁白
        desc: ''
        selected: false
        method: post
        url: '{{#env.GATEWAY_URL#}}/internal/narrate'
        authorization:
          type: no-auth
          config: null
        headers: 'Content-Type:application/json

          Authorization:Bearer {{#env.GATEWAY_TOKEN#}}'
        params: ''
        body:
          type: raw-text
          data:
          - id: body
            key: ''
            type: text
            value: '{{#plan.payload#}}'
        timeout:
          connect: 10
          read: 60
          write: 10
