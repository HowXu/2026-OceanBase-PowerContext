name: station7
x-dify-env: &dify-env
  SECRET_KEY: ${DIFY_SECRET_KEY:?Run python scripts/configure.py first}
  DB_HOST: db
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: ${DB_PASSWORD}
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: storage
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY}
  # The Workflow calls only the private, authenticated gateway on this network.
  SSRF_PROXY_HTTP_URL: ""
  SSRF_PROXY_HTTPS_URL: ""
  MIGRATION_ENABLED: "true"
  SERVER_WORKER_AMOUNT: 1
  CHECK_UPDATE_URL: ""
  LOG_LEVEL: WARNING
  CONSOLE_WEB_URL: http://localhost:8180
  CONSOLE_API_URL: http://localhost:8180
  SERVICE_API_URL: http://localhost:8180
  APP_WEB_URL: http://localhost:8180
  APP_API_URL: http://localhost:8180
  FILES_URL: http://localhost:8180
  VECTOR_STORE: weaviate
services:
  db:
    restart: unless-stopped
    image: postgres:15.14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dify
    volumes: [dify-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d dify"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    restart: unless-stopped
    image: redis:6.2.20-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD}"]
    volumes: [dify-redis:/data]
  sandbox:
    restart: unless-stopped
    image: langgenius/dify-sandbox:0.2.12
    environment:
      API_KEY: ${SANDBOX_API_KEY}
      GIN_MODE: release
      ENABLE_NETWORK: "true"
      WORKER_TIMEOUT: 15
    volumes: [sandbox-deps:/dependencies]
  dify-api:
    restart: unless-stopped
    image: langgenius/dify-api:1.9.1
    environment:
      <<: *dify-env
      MODE: api
    volumes: [dify-storage:/app/api/storage]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  dify-worker:
    restart: unless-stopped
    image: langgenius/dify-api:1.9.1
    environment:
      <<: *dify-env
      MODE: worker
      MIGRATION_ENABLED: "false"
      CELERY_WORKER_AMOUNT: 1
    volumes: [dify-storage:/app/api/storage]
    depends_on: [dify-api]
  dify-web:
    restart: unless-stopped
    image: langgenius/dify-web:1.9.1
    environment:
      CONSOLE_API_URL: http://localhost:8180
      APP_API_URL: http://localhost:8180
      NEXT_TELEMETRY_DISABLED: 1
      PM2_INSTANCES: 1
  dify:
    restart: unless-stopped
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8180:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [dify-api, dify-web]
  powercontext:
    restart: unless-stopped
    image: station7-app:local
    build: .
    command: [python, scripts/run_powercontext.py]
    environment:
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_AUTH_TOKEN: ${GATEWAY_TOKEN}
      POWERCONTEXT_SERVER_ACCESS_MODE: enforced
    volumes: [powercontext-data:/app/data]
  gateway:
    restart: unless-stopped
    image: station7-app:local
    build: .
    env_file: .env
    environment:
      POWERCONTEXT_TOKEN: ${GATEWAY_TOKEN}
    ports: ["127.0.0.1:8787:8787"]
    depends_on: [powercontext, dify-api]
volumes:
  dify-db:
  dify-redis:
  dify-storage:
  sandbox-deps:
  powercontext-data:
